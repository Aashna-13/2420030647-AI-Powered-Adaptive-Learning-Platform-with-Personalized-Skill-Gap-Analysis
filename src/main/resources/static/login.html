<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Sign In | SkillBridge AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark nav-main px-3 px-md-5">
  <div class="container-fluid px-0">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
      <i class="bi bi-cpu-fill text-primary-subtle me-2 fs-4"></i>
      <span>SkillBridge <span class="brand-ai">AI</span></span>
    </a>
    <div class="ms-auto">
      <a href="/register.html" class="btn btn-outline-light btn-sm px-3">
        <i class="bi bi-person-plus me-1"></i> Register
      </a>
    </div>
  </div>
</nav>

<!-- Auth Main Container -->
<main class="container my-auto py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="panel p-4 p-md-5 shadow-sm">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="icon-circle bg-primary-subtle text-primary mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h1 class="h3 fw-bold mb-1">Student Sign In</h1>
          <p class="text-secondary small mb-0">Access your personalized skill gap analysis & dashboard</p>
        </div>

        <!-- Alert Container -->
        <div id="loginAlert" class="alert d-none mb-3" role="alert" aria-live="polite"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">
              <i class="bi bi-envelope me-1 text-primary"></i> Email Address
            </label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="username">
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label fw-semibold mb-0" for="password">
                <i class="bi bi-key me-1 text-primary"></i> Password
              </label>
            </div>
            <div class="input-group mt-1">
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button class="btn btn-primary w-100 py-2 fw-semibold btn-submit mt-3" id="loginSubmitBtn" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to SkillBridge
          </button>
        </form>

        <!-- Quick Demo Credentials Fill -->
        <div class="mt-4 pt-3 border-top text-center">
          <span class="small text-muted d-block mb-2">Hackathon Demo Credentials:</span>
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-sm btn-outline-primary" type="button" id="fillDemoStudent">
              <i class="bi bi-person-fill me-1"></i> Demo Student
            </button>
            <button class="btn btn-sm btn-outline-secondary" type="button" id="fillDemoAdmin">
              <i class="bi bi-gear-fill me-1"></i> Admin User
            </button>
          </div>
        </div>

        <!-- Link to Register -->
        <div class="text-center mt-4">
          <p class="small text-secondary mb-0">
            Don't have an account yet?
            <a href="/register.html" class="fw-semibold text-primary text-decoration-none ms-1">Create an account</a>
          </p>
        </div>

      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="footer text-center py-3 text-secondary small mt-auto">
  <div class="container">
    <span>SkillBridge AI • Secure JWT Authentication • Hackathon Phase 2</span>
  </div>
</footer>

<script src="/auth.js"></script>
</body>
</html>
