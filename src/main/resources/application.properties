server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillbridge?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info

# JWT Security Configuration (Overridable via environment variables)
jwt.secret=${JWT_SECRET:SkillBridgeAISecretKeyForJWTHackathon2026MustBeAtLeast256BitsLongToWorkSecurelyWithHMACSHA256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# Optional Gemini AI study advice. Keep the API key in environment variables, never in source control.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
